{# Shared CSS for accounts list/detail pages — included in each template's <style> block. #}
<style>
.acc-page-header{
    background: linear-gradient(135deg, rgba(99,102,241,0.18), rgba(236,72,153,0.18));
    border: 1px solid rgba(148,163,184,0.18);
    border-radius: 16px; padding: 20px 24px; margin-bottom: 22px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
}
.acc-page-header h2{ margin:0; font-weight:700; letter-spacing:.3px; }
.acc-page-header .subtitle{ color: var(--text-muted); font-size:.9rem; margin-top:4px; }
.acc-page-header .acc-toolbar{ display:flex; gap:8px; flex-wrap:wrap; }

.kpi-card{
    position: relative; border:0; border-radius: 14px; color:#fff !important;
    overflow: hidden; min-height: 110px; box-shadow: 0 8px 20px rgba(2,6,23,.22);
}
.kpi-card .card-body{ padding:16px 18px; position:relative; z-index:2; }
.kpi-card .kpi-icon{ position:absolute; right:-6px; bottom:-10px; font-size:4.5rem; opacity:.18; z-index:1; line-height:1; }
.kpi-card .kpi-label{ text-transform:uppercase; font-size:.7rem; letter-spacing:.8px; font-weight:700; opacity:.92; }
.kpi-card .kpi-value{ font-size:1.6rem; font-weight:800; margin-top:4px; }
.kpi-card .kpi-value small{ font-size:.8rem; opacity:.85; font-weight:600; }
.kpi-emerald { background: linear-gradient(135deg,#10b981,#047857); }
.kpi-rose    { background: linear-gradient(135deg,#ef4444,#b91c1c); }
.kpi-blue    { background: linear-gradient(135deg,#3b82f6,#1d4ed8); }
.kpi-violet  { background: linear-gradient(135deg,#8b5cf6,#6d28d9); }
.kpi-amber   { background: linear-gradient(135deg,#f59e0b,#b45309); }
.kpi-cyan    { background: linear-gradient(135deg,#06b6d4,#0e7490); }
.kpi-slate   { background: linear-gradient(135deg,#64748b,#334155); }

.acc-section-card{ border:1px solid var(--border-color); border-radius:14px; background:var(--surface-1); overflow:hidden; }
.acc-section-card > .card-header{
    background: linear-gradient(180deg, rgba(99,102,241,.08), transparent);
    border-bottom: 1px solid var(--border-color);
    padding:14px 18px; display:flex; align-items:center; justify-content:space-between;
}
.acc-section-card > .card-header h5{ margin:0; font-weight:700; }

.filter-bar{ display:flex; gap:10px; flex-wrap:wrap; padding:12px 16px; background:var(--surface-2); border-bottom:1px solid var(--border-color); align-items:end; }
.filter-bar label{ display:block; font-size:.7rem; text-transform:uppercase; letter-spacing:.6px; color:var(--text-muted); margin-bottom:4px; font-weight:700; }
.filter-bar .form-control, .filter-bar .form-select{ min-height: 38px; }
.filter-bar .btn{ height:38px; }

.amount-in  { color:#10b981; font-weight:700; }
.amount-out { color:#ef4444; font-weight:700; }
.amount-mute{ color: var(--text-muted); }

.badge-soft-emerald{ background: rgba(16,185,129,.12); color:#10b981; border:1px solid rgba(16,185,129,.25); }
.badge-soft-rose   { background: rgba(239,68,68,.12);  color:#ef4444; border:1px solid rgba(239,68,68,.25); }
.badge-soft-amber  { background: rgba(245,158,11,.12); color:#f59e0b; border:1px solid rgba(245,158,11,.25); }
.badge-soft-cyan   { background: rgba(6,182,212,.12);  color:#06b6d4; border:1px solid rgba(6,182,212,.25); }
.badge-soft-violet { background: rgba(139,92,246,.12); color:#8b5cf6; border:1px solid rgba(139,92,246,.25); }
.badge-soft-info   { background: rgba(59,130,246,.12); color:#3b82f6; border:1px solid rgba(59,130,246,.25); }
.badge-soft-slate  { background: rgba(100,116,139,.12); color:#64748b; border:1px solid rgba(100,116,139,.25); }

.acc-table thead th{ background: var(--surface-2); font-size:.78rem; text-transform:uppercase; letter-spacing:.6px; color: var(--text-muted); }
.acc-table tbody tr:hover{ background: rgba(99,102,241,.04); }
.acc-table .empty-state{ text-align:center; color: var(--text-muted); padding: 36px 12px; }
.acc-table .empty-state i{ font-size: 2rem; opacity:.5; }
.acc-running{ font-weight:700; color: var(--text-primary); }
.acc-running.neg{ color:#ef4444; }
.tiny-pill{ padding:2px 8px; border-radius:999px; font-size:.7rem; font-weight:700; letter-spacing:.4px; text-transform:uppercase; }
</style>
